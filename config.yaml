# PTP + CU22 hardware decode + continuous XT32 PCAP collection.
# PCAP: <save_dir>/<date>/<run>/lidar/*.pcap; JPEG/GPS/meta keep their existing layout.
# Strict PTP admission: 100 us maximum reported offset, 5 seconds stable at startup.
# Camera 30 fps, LiDAR 20 Hz. No inferred camera/host clock offset is applied.
rtsp_profile: main
rtsp_url: rtsp://192.168.11.10:5005/routecam
rtsp_url_main: rtsp://192.168.11.10:5005/routecam
rtsp_url_low: ''
camera_codec: h264
camera_output_width: 1920
camera_output_height: 1080
camera_output_fps: 30
camera_gop_size: 30
camera_rc_type: CBR
camera_h264_profile: Main
camera_read_mode: gstreamer_vaapi
camera_latest_frame_enabled: true
camera_frame_buffer_size: 8
camera_connection_timeout_sec: 1.0
camera_watchdog_sec: 5.0
camera_reconnect_initial_sec: 1.0
camera_reconnect_max_sec: 30.0
camera_pts_enabled: true
camera_manifest_timestamp: capture
camera_durable_writes: true
camera_warmup_sec: 1.5
jpeg_quality: 80
camera_gpu_jpeg: true
bbox_flip_x: false
display_flip_x: false
bbox_source_size: 640x480
bbox_letterbox_size: ''
frame_save_fps: 30.0
camera_async_write: true
camera_write_queue_size: 128
drop_bad_frames: false
show_window: false
camera_decode_enabled: true
save_raw_video_copy: false
lidar_enabled: true
lidar_udp_port: 2368
lidar_bind_ip: 0.0.0.0
lidar_socket_rcvbuf_bytes: 4194304
lidar_log_interval_sec: 5
lidar_connection_timeout_sec: 0.5
lidar_reconnect_initial_sec: 1.0
lidar_reconnect_max_sec: 30.0
lidar_save_mode: continuous
lidar_camera_offset_sec: 0.0
lidar_storage_format: pcap
lidar_pcap_seconds: 10.0
lidar_pcap_gzip: false
lidar_pcap_queue_size: 8
lidar_kernel_timestamp: true
lidar_fov_filter_enabled: true
camera_forward_offset_deg: -177.08
lidar_h_margin_deg: 80.0
gps_enabled: true
gps_device: auto
gps_preferred_device: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
gps_baudrate: 115200
gps_connection_timeout_sec: 3.0
gps_reconnect_initial_sec: 1.0
gps_reconnect_max_sec: 30.0
run_rotation_minutes: 10
run_rotation_arm_lead_sec: 5.0
camera_handover_grace_sec: 5.0
record_enabled: true
save_dir: /mnt/ssd/porthole_runs
save_frames: true
save_lidar_raw: true
storage_preflight_mib: 4
storage_min_write_mibs: 15.0
min_free_gb: 1.0
disk_check_interval_sec: 30
health_log_interval_sec: 60
health_warn_cpu_temp_c: 80
