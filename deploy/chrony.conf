# PTP master host: slow corrections preserve sensor servo lock.
pool time.cloudflare.com iburst maxsources 2 minpoll 5 maxpoll 8
pool ntp.ubuntu.com iburst maxsources 2 minpoll 6 maxpoll 10
driftfile /var/lib/chrony/chrony.drift
makestep 1.0 1
maxslewrate 5
corrtimeratio 100
maxupdateskew 10
maxdrift 100
rtcsync
log tracking
logdir /var/log/chrony
